# Publishes a GitHub Release when a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release)
# is pushed. It checks the tag sits on main and matches the code's version, runs the tests,
# then writes the notes from the pull requests merged since the last release.
# How to cut one: README.md, "Release".
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to see whether the tag is on main
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches pyproject.toml and frontend/package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          frontend=$(node -p 'require("./frontend/package.json").version')
          echo "tag $tag, pyproject.toml $python, frontend/package.json $frontend"
          [ "$tag" = "$python" ] && [ "$tag" = "$frontend" ]

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag --title "$GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
