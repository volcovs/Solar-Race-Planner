<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Race strategy for solar cars from open satellite and weather data." />
    <title>Solar Race Planner</title>
    <script>
      // Apply the saved or system theme before the first paint, so the page never flashes.
      // Same storage key as src/lib/theme.ts.
      try {
        const saved = localStorage.getItem("srp-theme");
        const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : system;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
