server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths (/plan, /map, ...) get index.html and the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always checked with the server, so phones notice a new deploy.
    location ~ ^/(sw\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
    }

    # Built assets have content hashes in their names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # nginx's mime.types has no .mjs, and browsers refuse to start a module
        # worker (the map's) served as application/octet-stream.
        location ~ \.mjs$ {
            default_type text/javascript;
        }
    }
}
